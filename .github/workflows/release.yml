name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-17-dev clang-17 cmake ninja-build
          echo "LLVM_DIR=/usr/lib/llvm-17/lib/cmake/llvm" >> $GITHUB_ENV
          echo "CC=clang-17" >> $GITHUB_ENV
          echo "CXX=clang++-17" >> $GITHUB_ENV
      - name: Build & Package
        run: |
          cmake -S . -B build -G Ninja -DLLVM_DIR="$LLVM_DIR"
          cmake --build build --config Release
          ./scripts/run_a3_finalize.sh || true
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            CHANGELOG.md
            docs/A3.md
            docs/guia.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
